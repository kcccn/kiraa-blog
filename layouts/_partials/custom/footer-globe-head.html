{{- $relPermalink := lower (.RelPermalink | default "") -}}
{{- $isArchivesOrOffline := or
  (and (eq .Kind "home") (in $relPermalink "/archives/"))
  (in $relPermalink "/offline/")
-}}
{{- if not $isArchivesOrOffline -}}
  {{- .Store.Set "hasEcharts" true -}}
  <script>window.__kiraaFooterGlobeEnabled=true;</script>
{{- end -}}
